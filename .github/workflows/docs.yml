name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install MkDocs Material
        run: python -m pip install -r docs/requirements.txt

      - name: Build, failing on any warning or broken link
        run: mkdocs build --strict --site-dir site

      # The demo videos live as v1.0.0 release assets, not in the repository, so a plugin install stays small.
      # GitHub serves release assets as downloads from another domain, which browsers will not play inline,
      # so the site serves its own copies.
      - name: Add the demo videos to the site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p site/videos
          for f in demo.mp4 chatops-demo.mp4; do
            curl -fsSL -o "site/videos/$f" "https://github.com/${{ github.repository }}/releases/download/v1.0.0/$f"
          done

      # GitHub Pages on a free plan needs a public repository; until then the site is only built.
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
