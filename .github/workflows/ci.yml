name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hermes ${{ matrix.hermes }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release (requires_hermes) and the newest one tested live.
        hermes: ["v0.21.6", "v0.23.0"]
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out Hermes Agent ${{ matrix.hermes }}
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The Python Hermes's own installer uses.
          python-version: "3.14"

      - name: Install Hermes Agent and the plugin's dependencies
        run: |
          python -m pip install --upgrade pip
          # Hermes builds no wheels; an editable install is its documented development path.
          python -m pip install -e ./hermes-agent
          python -m pip install -r plugin/requirements.txt

      - name: Unit and contract tests
        working-directory: plugin
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/hermes-agent
          HERMES_TESTS_REQUIRED: "1"
        run: python -m unittest discover -s tests

      - name: Catalog validation
        run: hermes plugins validate --install-deps plugin
