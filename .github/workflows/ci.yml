name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hermes ${{ matrix.hermes }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release (requires_hermes in plugin.yaml) and the newest one tested live.
        hermes: ["v0.22.3", "v0.23.0"]
    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: plugin

      - name: Check out Hermes Agent ${{ matrix.hermes }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install Hermes Agent from its lock file
        working-directory: hermes-agent
        run: |
          uv sync --frozen
          uv pip install --python .venv -r ../plugin/requirements.txt

      - name: Unit and contract tests
        working-directory: plugin
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/hermes-agent
          HERMES_TESTS_REQUIRED: "1"
        run: ../hermes-agent/.venv/bin/python -m unittest discover -s tests

      - name: Catalog validation
        run: hermes-agent/.venv/bin/hermes plugins validate --install-deps plugin
