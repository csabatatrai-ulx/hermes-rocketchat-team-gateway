# Builds the documentation site for GitLab Pages when this repository is mirrored to a GitLab instance.
# The GitHub Actions workflows in .github/ do the same for GitHub Pages.
pages:
  image: python:3.12-slim
  variables:
    SITE_URL: "$CI_PAGES_URL/"
  script:
    - pip install --no-cache-dir -r docs/requirements.txt
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
